<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación — Automóvil (v2: interacción con mouse)</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!--
    Versión 2: los videos permanecen de fondo y se controlan arrastrando
    horizontalmente el mouse (o el dedo en táctil). Sin textos superpuestos.
    Cada sección es una instancia independiente del scrub.
  -->
  <main class="showcase-page">

    <!-- Bloque 1: video de prueba -->
    <section class="car-showcase car-showcase--drag" aria-label="Presentación interactiva (video de prueba)">
      <div class="car-showcase__media">
        <!--
          Selección por media query: móvil carga la versión ligera (720p)
          y escritorio la HD (1080p). El orden importa: el navegador usa
          la primera fuente cuyo media coincida; sin coincidencia (o sin
          soporte) cae a la última.
        -->
        <video
          class="car-showcase__video"
          muted
          playsinline
          preload="auto"
          tabindex="-1"
          aria-hidden="true"
        >
          <source src="video/oil-720p.mp4" media="(max-width: 768px)" type="video/mp4">
          <source src="video/oil-1080p.mp4" type="video/mp4">
        </video>
        <div class="car-showcase__overlay" aria-hidden="true"></div>
      </div>

      <!-- Invitación a arrastrar; desaparece en la primera interacción -->
      <div class="car-showcase__drag-hint" aria-hidden="true">
        <svg class="car-showcase__drag-icon" viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 8l-4 4 4 4" />
          <path d="M17 8l4 4-4 4" />
          <path d="M3 12h18" />
        </svg>
        <span class="car-showcase__drag-label">ドラッグして探索</span>
      </div>

      <!-- Instrucción para lectores de pantalla (oculta visualmente) -->
      <p class="car-showcase__hint">
        Arrastra horizontalmente sobre la imagen para avanzar o retroceder en la presentación.
      </p>
    </section>

    <!-- Bloque 2: video del auto (mismo componente, otra fuente) -->
    <section class="car-showcase car-showcase--drag" aria-label="Presentación interactiva del automóvil">
      <div class="car-showcase__media">
        <video
          class="car-showcase__video"
          muted
          playsinline
          preload="auto"
          tabindex="-1"
          aria-hidden="true"
        >
          <source src="video/car-720p.mp4" media="(max-width: 768px)" type="video/mp4">
          <source src="video/car-1080p.mp4" type="video/mp4">
        </video>
        <div class="car-showcase__overlay" aria-hidden="true"></div>
      </div>

      <div class="car-showcase__drag-hint" aria-hidden="true">
        <svg class="car-showcase__drag-icon" viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 8l-4 4 4 4" />
          <path d="M17 8l4 4-4 4" />
          <path d="M3 12h18" />
        </svg>
        <span class="car-showcase__drag-label">ドラッグして探索</span>
      </div>

      <p class="car-showcase__hint">
        Arrastra horizontalmente sobre la imagen para avanzar o retroceder en la presentación.
      </p>
    </section>

  </main>

  <script src="js/car-showcase-drag.js"></script>
</body>
</html>
